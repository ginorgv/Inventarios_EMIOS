<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario · Iniciar sesión</title>
<style>
  :root{
    --p: #2563eb; --p2:#1d4ed8; --bg:#f1f5f9; --card:#ffffff; --tx:#0f172a; --tx2:#64748b;
    --line:#e2e8f0; --ok:#16a34a; --warn:#f59e0b; --err:#ef4444;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  body{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 55%,#3b82f6 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .login{display:flex; background:var(--card); border-radius:18px; overflow:hidden; box-shadow:0 25px 60px rgba(2,6,23,.35); max-width:880px; width:100%;}
  .login-izq{background:linear-gradient(160deg,#1e3a8a,#2563eb); color:#fff; padding:44px 38px; width:46%; display:flex; flex-direction:column; justify-content:space-between;}
  .login-izq h1{font-size:24px; line-height:1.25; margin-bottom:10px;}
  .login-izq p{font-size:14px; opacity:.85; line-height:1.5;}
  .login-izq .badge{display:inline-flex; align-items:center; gap:8px; background:rgba(255,255,255,.15); padding:8px 14px; border-radius:999px; font-size:13px; margin-bottom:22px; width:fit-content;}
  .login-der{padding:44px 38px; width:54%;}
  .login-der h2{font-size:20px; color:var(--tx); margin-bottom:6px;}
  .login-der .sub{color:var(--tx2); font-size:13px; margin-bottom:24px;}
  .campo{margin-bottom:16px;}
  .campo label{display:block; font-size:13px; color:var(--tx); font-weight:600; margin-bottom:6px;}
  .campo input{width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:9px; font-size:14px; background:#f8fafc; transition:.15s;}
  .campo input:focus{outline:none; border-color:var(--p); box-shadow:0 0 0 3px rgba(37,99,235,.15); background:#fff;}
  .boton{width:100%; padding:12px; background:var(--p); color:#fff; border:none; border-radius:9px; font-size:15px; font-weight:600; cursor:pointer; transition:.15s;}
  .boton:hover{background:var(--p2);}
  .recordar{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--tx2); margin:4px 0 16px;}
  .recordar input{accent-color:var(--p);}
  .error{background:#fef2f2; color:var(--err); border:1px solid #fecaca; padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:16px; display:none;}
  .foot{font-size:12px; color:var(--tx2); text-align:center; margin-top:18px;}
  @media(max-width:720px){ .login{flex-direction:column;} .login-izq,.login-der{width:100%;} }
</style>
</head>
<body>
  <div class="login">
    <div class="login-izq">
      <div>
        <div class="badge">📦 Sistema de Inventario</div>
        <h1>Gestión de activos<br>y localizaciones</h1>
        <p>Administra tu inventario por ubicaciones con la misma base de datos que ya utilizas.</p>
      </div>
      <p style="font-size:12px; opacity:.7;">Inventario · v1.0</p>
    </div>
    <div class="login-der">
      <h2>Iniciar sesión</h2>
      <div class="sub">Accede con tu usuario de inventario</div>
      <div class="error" id="err">Credenciales incorrectas (demo: admin / 1234)</div>
      <div class="campo">
        <label for="u">Usuario</label>
        <input id="u" type="text" placeholder="usuario" value="admin">
      </div>
      <div class="campo">
        <label for="p">Contraseña</label>
        <input id="p" type="password" placeholder="••••••••" value="1234">
      </div>
      <label class="recordar"><input type="checkbox" checked> Recordarme</label>
      <button class="boton" id="btn">Entrar</button>
      <div class="foot">© 2026 Inventario · Mockup UI</div>
    </div>
  </div>
<script>
  document.getElementById('btn').addEventListener('click', function(){
    var u=document.getElementById('u').value, p=document.getElementById('p').value;
    if(u==='admin' && p==='1234'){ location.href='index.html'; }
    else{ document.getElementById('err').style.display='block'; }
  });
</script>
</body>
</html>
